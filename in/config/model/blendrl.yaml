# BlendRL framework — composes symbolic and neural policy modules
actor_mode: hybrid
blender:
  mode: neural
  blend_function: softmax
blend_q_values: true
blend_ent_coef: 0.05
logic_lr: 0.001
blender_lr: 0.0005

neural:
  type: dnn
  hidden_sizes: [256, 256]

symbolic:
  type: nsfr
  rules: default
