architecture: mlp_classifier
# Resolved through paradigm_loader's component registry. Without this, supervised
# falls back to the early-prediction module, which only accepts lstm/transformer
# and expects MIMIC-shaped sequence batches.
lightning_module: TabularClassifierLightningModule
hidden_sizes: [128, 64]
dropout: 0.1
# One logit per sample: what ClassificationEvalProtocol expects for a binary task.
n_classes: 1
activation: relu
