# Output directory & path configuration
# output_dir: null  # Optional override for base directory (defaults to "results/plots/{group}/{exp_id}")
output_subdir: losses
filename_prefix: "offline_"

# Axes and Title configuration
# title supports templates: {exp_id}, {display_name}, {method}, {metric}, {clean_metric}
# or can be a dict mapping metric to custom title
title: "{display_name}: {clean_metric}"
xlabel: "Transitions"
ylabel: null  # Optional override; null defaults to clean metric name (e.g. "Bellman Loss")

figsize: [8, 5]
dpi: 300
smoothing_window: 10
x_axis: transitions

style:
  grid: true
  grid_alpha: 0.3
  line_width: 2.0

metrics:
  - losses/total_loss
  - losses/actor_loss
  - losses/q_loss
  - losses/value_loss
  - losses/bellman_loss
  - losses/cql_loss
  - losses/blend_entropy
