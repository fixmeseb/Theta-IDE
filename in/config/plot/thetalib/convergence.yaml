# Output directory & path configuration
# output_dir: null  # Optional override for the base plot directory (defaults to "results/plots/{group}/{exp_id}")
output_subdir: convergence  # Subdirectory inside output_dir where convergence plots are saved
filename_prefix: ""         # Optional prefix for output plot filenames

# Axes and Title configuration
# title supports templates: {exp_id}, {metric}, {clean_metric} or can be a dict mapping metric to custom title
title: "{exp_id}: {clean_metric}"
xlabel: "Transitions"
ylabel: null  # Optional override; null defaults to clean metric name (e.g. "Eval Reward")

figsize: [8, 5]
dpi: 300
smoothing_window: 10
x_axis: transitions

style:
  grid: true
  grid_alpha: 0.3
  line_width: 2.0
  marker_size: 6
  font_family: sans-serif

metrics:
  - eval/reward
  - train/reward
  - train/length
