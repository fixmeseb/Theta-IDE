type: base
description: "Offline RL on a static transition dataset (CQL, IQL, etc.)"
runner: OfflineRLRunner
data_module: RLReplayBufferDataModule
eval_protocol: OfflineRLEvalProtocol
default_callbacks:
  - ModelCheckpointCallback
constraints:
  requires:
    methods: non_empty
    agent: required
  forbids:
    eval_episodes: non_zero
forbidden_agents:
  - ppo
