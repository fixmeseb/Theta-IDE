# @package _global_
defaults:
  - Karthik_Supervised_Test/_base

experiment_id: breast_cancer_clf
seed: 42
total_timesteps: 10000

no_plot: true
tensorboard: true

methods:
  clf:
    model: mlp_classifier
    # Validation loss bottoms around epoch 7 on this dataset and climbs after,
    # so ten epochs finishes near the best model instead of memorising the
    # 398 training rows: the gap to the best epoch is 3% here against 142% at 50.
    epochs: 10
