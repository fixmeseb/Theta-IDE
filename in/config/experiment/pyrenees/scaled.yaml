# @package _global_
defaults:
- pyrenees/_base
plots:
  losses:
    metrics:
    - losses/total_loss
    - losses/bellman_loss
    - losses/cql_loss
    - losses/q_loss
    - losses/actor_loss
  reports: {}
methods:
  cql_blendrl_human_dueling_resnet:
    agent: cql
    model: blendrl
    epochs: 30
    eval_every_n_epochs: 5
    batch_size: 512
    lr: 3e-4
    cql_alpha: 1.0
  cql_dnn:
    agent: cql
    model: dnn
    target_entropy: -1.0
    tau: 0.005
    clip_range: 0.2
  cql_dnn_2:
    agent: cql
    model: dnn
  cql_dnn_3:
    agent: cql
    model: dnn
  cql_dnn_4:
    agent: cql
    model: dnn
