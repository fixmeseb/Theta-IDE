# @package _global_
defaults:
- pyrenees/_base
- override /hydra/sweeper: optuna_offline

consolidate: true

hydra:
  sweeper:
    storage:
    study_name: "pyrenees_3way_sweep"
    direction: minimize
    n_trials: 350
    params:
      agent.lr: tag(log, interval(5e-5, 2e-3))
      agent.cql_alpha: tag(log, interval(0.05, 5.0))
      agent.soft_target_tau: interval(0.001, 0.03)
      agent.blender_lr: tag(log, interval(5e-5, 2e-3))
      agent.logic_lr: tag(log, interval(1e-3, 5e-2))
      agent.blend_ent_coef: tag(log, interval(0.005, 0.1))
methods:
  cql_blendrl_human_neural:
    agent: cql
    model: blendrl
    epochs: 50
    eval_every_n_epochs: 5
    batch_size: 512
  cql_blendrl_human_neural_logic:
    agent: cql
    model: blendrl
    epochs: 50
    eval_every_n_epochs: 5
    batch_size: 512
  cql_blendrl_human_dueling_resnet_logic:
    agent: cql
    model: blendrl
    epochs: 50
    eval_every_n_epochs: 5
    batch_size: 512
