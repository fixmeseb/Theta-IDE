# @package _global_
defaults:
- pyrenees/_base

consolidate: false

resources:
  partition: common
  cores: 8
  memory: "4G"
  time: "04:00:00"

methods:
  params:
    agent: cql
    epochs: 50
    eval_every_n_epochs: 5
    batch_size: 256
    lr: 3e-4
    cql_alpha: 1.0
    soft_target_tau: 0.005
    blender_lr: 3e-4

  cql_dnn:
    model: dnn
  cql_blendrl_human_neural:
    model: blendrl
