# @package _global_
defaults:
- pyrenees/_base
- override /hydra/sweeper: optuna_offline


hydra:
  sweeper:
    storage:
    study_name: "pyrenees_blendrl_human_dueling_resnet"
    direction: minimize
    n_trials: 70
    n_jobs: 1
    params:
      agent.lr: tag(log, interval(5e-5, 2e-3))
      agent.cql_alpha: tag(log, interval(0.05, 5.0))
      agent.soft_target_tau: interval(0.001, 0.03)
      agent.blender_lr: tag(log, interval(5e-5, 2e-3))
methods:
  cql_blendrl_human_dueling_resnet:
    agent: cql
    model: blendrl
    epochs: 35
    eval_every_n_epochs: 5
    batch_size: 512
  cql_blendrl_human_dueling_resnet_logic:
    agent: cql
    model: blendrl
    epochs: 35
    eval_every_n_epochs: 5
    batch_size: 512
