# @package _global_
defaults:
- pyrenees/_base
- override /hydra/sweeper: optuna_offline


hydra:
  sweeper:
    storage: "sqlite:///results/optuna/optuna_pyrenees_scaled.db?timeout=120"
    direction: minimize
    n_trials: 32
    n_jobs: 1
    params:
      agent.lr: tag(log, interval(1e-4, 1e-3))
      agent.cql_alpha: tag(log, interval(0.02, 1.5))
      agent.blender_lr: tag(log, interval(1e-4, 2e-3))
      agent.weight_decay: tag(log, interval(1e-5, 1e-2))
methods:
  cql_dueling_resnet:
    agent: cql
    model: dueling_resnet
    epochs: 15
    eval_every_n_epochs: 3
    batch_size: 512
    soft_target_tau: 0.005
  cql_blendrl_human_dueling_resnet:
    agent: cql
    model: blendrl
    epochs: 15
    eval_every_n_epochs: 3
    batch_size: 512
    soft_target_tau: 0.005
  cql_blendrl_cross_attention:
    agent: cql
    model: blendrl
    epochs: 15
    eval_every_n_epochs: 3
    batch_size: 512
    soft_target_tau: 0.005
