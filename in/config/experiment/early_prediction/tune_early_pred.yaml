# @package _global_
defaults:
  - early_prediction/_base

sweep: true


early_prediction:
  checkpoint: "results/checkpoints/mimic/cql_literature"
  dataset_path: "in/datasets/mimic/mimic_lazy_12_clean_with_interventions.npz"
  output_dir: "results/plots/early_prediction/tune_early_pred"
  n_trials: 200
  n_splits: 10
  window_hours: 12
  metric: accuracy 
  target_models:
    - lstm_no_v
    - lstm_with_v
    - transformer_no_v
    - transformer_with_v

plots:
  - ep_dl_sweep
  - ep_agreement
  - ep_trajectories
  - ep_counterfactual_table
