# @package _global_
defaults:
- cartpole/_base
total_timesteps: 64000
intervals_count: 1
eval_episodes: 2
no_plot: true
env:
  num_envs: 10
  num_steps: 64
trainer:
  accelerator: cpu
  max_epochs: 1
  check_val_every_n_epoch: 3
methods:
  ppo_blendrl_human_neural:
    agent: ppo
    model: blendrl
    lr: 0.007
    logic_lr: 0.007
    blender_lr: 0.02
    ent_coef: 0.002
    blend_ent_coef: 0.002
    num_minibatches: 4
    update_epochs: 10
    clip_coef: 0.2
