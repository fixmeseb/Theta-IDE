# @package _global_
defaults:
- override /env: cartpole

paradigm: offline_rl

# Offline CartPole Experiment on static transitions
total_timesteps: 100000
eval_episodes: 0

plots:
  losses:
    metrics: ["losses/total_loss", "losses/bellman_loss", "losses/value_loss"]
  convergence: {}

methods:
  params:
    agent: iql

  iql_cp_tuned:
    model: dnn
  iql_blendrl_cp_tuned:
    model: blendrl
