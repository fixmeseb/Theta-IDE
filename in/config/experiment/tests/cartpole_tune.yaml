# @package _global_
defaults:
  - cartpole/_base

total_timesteps: 640
eval_episodes: 2
no_plot: true

env:
  num_envs: 10
  num_steps: 64

trainer:
  accelerator: cpu
  max_epochs: 1
  check_val_every_n_epoch: 3

tuning:
  n_trials: 2

methods:
  ppo_tuned:
    agent: ppo
    model: blendrl
    tune:
      agent.lr: choice(0.005, 0.007)
