# @package _global_
defaults:
  - pyrenees/_base

dataset_path: in/datasets/pyrenees/cql
no_plot: true

trainer:
  limit_train_batches: 2
  limit_val_batches: 2

methods:
  params:
    epochs: 1
    eval_every_n_epochs: 1

    agent:
      cql:
        batch_size: 256
        lr: 1e-4
        cql_alpha: 2.0
        weight_decay: 1e-4

  cql_dnn:
    agent: cql
    model: dnn

