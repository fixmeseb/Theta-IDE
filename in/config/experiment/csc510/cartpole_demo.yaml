# @package _global_
defaults:
- csc510/_base
total_timesteps: 3000
eval_episodes: 1
intervals_count: 1
plots:
  convergence:
    smoothing_window: 3
    metrics:
    - eval/reward
  losses:
    smoothing_window: 5
    metrics:
    - losses/total_loss
    - losses/policy_loss
  reports:
    include_hyperparameters: true
methods:
  ppo_cp_tuned:
    agent: ppo
    model: dnn
