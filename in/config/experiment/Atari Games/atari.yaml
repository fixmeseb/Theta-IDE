# @package _global_
defaults:
- Atari Games/_base
- override /env: atari/pong
seed: 42
total_timesteps: 10000
methods:
  ppo_dnn:
    agent: ppo
    model: dnn
  blendRL:
    agent: sb3/sac
    model: blendrl
    fyd_top_k: 50
    neural:
      type: dnn
      activation: relu
    symbolic:
      type: nsfr
    logic_lr: 0.001
    actor_mode: hybrid
    blender:
      mode: neural
