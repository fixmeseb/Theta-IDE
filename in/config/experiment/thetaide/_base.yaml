# @package _global_
# Base for experiments built in the ThetaIDE experiment builder.
# The GUI composes this recipe plus Hydra overrides; exported recipes list it under defaults.
defaults:
  - override /env: cartpole

paradigm: online_rl
seed: 42
recover: false
# Also write TensorBoard logs to results/tensorboard/ (viewable in the GUI's TensorBoard tab)
tensorboard: false
