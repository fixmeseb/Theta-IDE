# @package _global_
defaults:
- override /env: breast_cancer

intervals_count: 1
eval_episodes: 0
paradigm: unsupervised
consolidate: false
partition: common

# Model-only methods: unsupervised declares no agents.
#
# An experiment's methods block MERGES with this one rather than replacing it,
# so an experiment that wants a different configuration should override this
# name instead of introducing a parallel one, or the default runs as an extra.
methods:
  ae_dense:
    model: dense_autoencoder
    latent_dim: 8
