# @package _global_
defaults:
- mimic/_base
- override /site: ncshare_common

# Discrete CQL Comparison Benchmark: Pure Neural vs. Value-Based BlendRL
# All models train under identical discrete CQL Bellman + LogSumExp loss on Q-values.

resources:
  time: "01:00:00"

methods:
  # Universal parameters applied across all methods in this experiment
  params:
    epochs_per_interval: 25
    eval_interval_epochs: 2

    agent:
      cql:
        batch_size: 1024
        lr: 3e-4
        cql_alpha: 0.1
        reward_scale: 1.0
        pos_action_weight: 15.0
        bellman_loss: smooth_l1
        weight_decay: 1e-4

    model:
      blendrl:
        blend_q_values: true

  cql_dnn:
    agent: cql
    model: dnn
  cql_dueling_resnet:
    agent: cql
    model: dueling_resnet
  cql_blendrl_human_rigid:
    agent: cql
    model: blendrl
  cql_blendrl_human_dueling_resnet_rigid:
    agent: cql
    model: blendrl
  cql_blendrl_cew_dueling_resnet:
    agent: cql
    model: blendrl


