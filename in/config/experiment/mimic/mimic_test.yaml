# @package _global_
defaults:
  - mimic/_base

methods:
  params:
    agent: cql
    epochs_per_interval: 4
    eval_interval_epochs: 1
    lr: 1e-4
    cql_alpha: 2.0
    blend_ent_coef: 0.1
    ent_coef: 0.05
    weight_decay: 1e-4

  cql_dnn:
    model: dnn
  cql_transformer:
    model: transformer
  cql_blendrl_human_rigid:
    model: blendrl
  cql_blendrl_human_continuous:
    model: blendrl
  cql_blendrl_cross_attention:
    model: blendrl
  cql_blendrl_human_transformer:
    model: blendrl
