# @package _global_
defaults:
  - mimic/_base

methods:
  params:
    agent: cql
    epochs_per_interval: 25
    eval_interval_epochs: 5
    lr: 2e-4
    cql_alpha: 2.0
    reward_scale: 0.1
    bellman_loss: smooth_l1
    blend_ent_coef: 0.1
    ent_coef: 0.05
    weight_decay: 1e-4

  cql_dueling_resnet:
    model: dueling_resnet
  cql_blendrl_human_dueling_resnet_rigid:
    model: blendrl
  cql_blendrl_human_dueling_resnet_continuous:
    model: blendrl
  cql_blendrl_cew_dueling_resnet:
    model: blendrl
  cql_blendrl_cross_attention:
    model: blendrl
