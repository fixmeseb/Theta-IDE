# @package _global_
defaults:
- mimic/_base
- override /site: ncshare_common

# Discrete CQL Comparison Benchmark: Pure Neural vs. Value-Based BlendRL
# All models train under identical discrete CQL Bellman + LogSumExp loss on Q-values.

resources:
  time: "08:00:00"
methods:
  params:
    epochs: 25
    eval_every_n_epochs: 5

    agent:
      cql:
        batch_size: 1024
        lr: 2e-4
        cql_alpha: 2.0
        reward_scale: 0.1
        bellman_loss: smooth_l1
        weight_decay: 1e-4

    model:
      blendrl:
        blend_q_values: true

  cql_dnn:
    agent: cql
    model: dnn

  cql_dueling_resnet:
    agent: cql
    model: dueling_resnet

  cql_blendrl_human_rigid:
    agent: cql
    model:
      blendrl:
        symbolic:
          rules: rigid

  cql_blendrl_human_dueling_resnet_rigid:
    agent: cql
    model:
      blendrl:
        neural: dueling_resnet
        symbolic:
          rules: rigid

  cql_blendrl_cew_dueling_resnet:
    agent: cql
    model:
      blendrl:
        neural: dueling_resnet
        symbolic:
          cew:
            ecm_dthr: 0.03


