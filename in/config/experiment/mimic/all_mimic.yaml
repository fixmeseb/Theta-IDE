# @package _global_
defaults:
- mimic/_base
resources:
  time: '24:00:00'
  gpus: 1
  cores: 16
  memory: 64G
methods:
  params:
    agent: cql
    epochs_per_interval: 25
    eval_interval_epochs: 5
    lr: 2e-4
    cql_alpha: 2.0
    weight_decay: 1e-4
  cql_dnn:
    model: dnn
    ent_coef: 0.05
  cql_dueling_resnet:
    model: dueling_resnet
  cql_transformer:
    model: transformer
  cql_blendrl_rigid:
    model: blendrl
    blend_ent_coef: 0.1
    ent_coef: 0.05
  cql_blendrl_continuous:
    model: blendrl
    blend_ent_coef: 0.1
    ent_coef: 0.05
  cql_blendrl_dueling_resnet:
    model: blendrl
    blend_ent_coef: 0.1
  cql_blendrl_transformer:
    model: blendrl
    blend_ent_coef: 0.1
  cql_blendrl_cross_attention:
    model: blendrl
    blend_ent_coef: 0.1
  cql_blendrl_cew:
    model: blendrl
    blend_ent_coef: 0.1
  cql_blendrl_cew_only:
    model: blendrl
  cew_fyd:
    model: cew
    fyd: true
    fyd_top_k: 50
env: pyrenees
