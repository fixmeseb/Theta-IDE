# @package _global_
defaults:
  - mimic/_base

consolidate: true

methods:
  params:
    agent: cql
    epochs_per_interval: 2
    eval_interval_epochs: 1
    batch_size: 1024
    cql_alpha: 2.0
    weight_decay: 1e-4

  cql_dnn:
    model: dnn
  cql_blendrl_human_neural:
    model: blendrl
  cql_blendrl_human_cew:
    model: blendrl
  cew_fyd:
    model: cew
