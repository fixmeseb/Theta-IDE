id: model_distillation
name: Model Distillation (NeSy Teacher -> Student MLP)
description: A large hybrid BlendRL teacher model generates rollout transitions with
  soft action logits to train a fast student MLP.
nodes:
  teacher_model:
    id: teacher_model
    label: Pretrained BlendRL (Teacher)
    category: paradigm
    paradigm: online_rl
    experiment_ref: seaquest/quick_test
    overrides: []
    pos:
    - 60
    - 120
    inputs:
    - name: initial_weights
      direction: input
      port_type: checkpoint
      description: Warm-start weights for fine-tuning / transfer learning.
      param_binding: ++model.checkpoint_path=${source.checkpoint_path}
      required: false
    outputs:
    - name: checkpoint
      direction: output
      port_type: checkpoint
      description: Saved policy checkpoint (.ckpt)
      param_binding: ''
      required: false
    - name: dataset
      direction: output
      port_type: dataset
      description: Generated trajectory buffer chunk files (.pkl)
      param_binding: ''
      required: false
    - name: metrics
      direction: output
      port_type: metrics
      description: Online training log CSV metrics
      param_binding: ''
      required: false
  rollout_generator:
    id: rollout_generator
    label: Trajectory Rollout Generator
    category: task
    paradigm: rollout
    experiment_ref: ''
    overrides: []
    pos:
    - 420
    - 120
    inputs:
    - name: teacher_checkpoint
      direction: input
      port_type: checkpoint
      description: Teacher model checkpoint
      param_binding: ''
      required: true
    outputs:
    - name: soft_dataset
      direction: output
      port_type: dataset
      description: Dataset with soft targets and state visits
      param_binding: ''
      required: false
  student_mlp:
    id: student_mlp
    label: Compact Student MLP
    category: task
    paradigm: distillation
    experiment_ref: ''
    overrides: []
    pos:
    - 780
    - 120
    inputs:
    - name: teacher_checkpoint
      direction: input
      port_type: checkpoint
      description: Pretrained teacher policy weights
      param_binding: ++distill.teacher_checkpoint=${source.checkpoint_path}
      required: false
    - name: dataset
      direction: input
      port_type: dataset
      description: Trajectory dataset with soft teacher action targets
      param_binding: ++mode.dataset_path=${source.dataset_path}
      required: false
    outputs:
    - name: student_checkpoint
      direction: output
      port_type: checkpoint
      description: Distilled compact student model weights
      param_binding: ''
      required: false
    - name: metrics
      direction: output
      port_type: metrics
      description: Student imitation loss & validation divergence
      param_binding: ''
      required: false
strings:
- id: wire_teacher_model_checkpoint_to_rollout_generator_teacher_checkpoint
  from: teacher_model.checkpoint
  to: rollout_generator.teacher_checkpoint
  port_type: checkpoint
  binding: ''
- id: wire_rollout_generator_soft_dataset_to_student_mlp_dataset
  from: rollout_generator.soft_dataset
  to: student_mlp.dataset
  port_type: dataset
  binding: ++mode.dataset_path=${source.dataset_path}
