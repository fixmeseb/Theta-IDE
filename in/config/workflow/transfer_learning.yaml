id: transfer_learning
name: Transfer Learning (CartPole -> MountainCar)
description: Trains a source policy on CartPole, then wires the checkpoint weights
  to warm-start fine-tuning on MountainCar.
nodes:
  source_trainer:
    id: source_trainer
    label: CartPole PPO (Source)
    category: paradigm
    paradigm: online_rl
    experiment_ref: csc510/cartpole_demo
    overrides: []
    pos:
    - 60
    - 120
    inputs:
    - name: initial_weights
      direction: input
      port_type: checkpoint
      description: Warm-start weights for fine-tuning / transfer learning.
      param_binding: ++model.checkpoint_path=${source.checkpoint_path}
      required: false
    outputs:
    - name: checkpoint
      direction: output
      port_type: checkpoint
      description: Saved policy checkpoint (.ckpt)
      param_binding: ''
      required: false
    - name: dataset
      direction: output
      port_type: dataset
      description: Generated trajectory buffer chunk files (.pkl)
      param_binding: ''
      required: false
    - name: metrics
      direction: output
      port_type: metrics
      description: Online training log CSV metrics
      param_binding: ''
      required: false
  target_fine_tuner:
    id: target_fine_tuner
    label: MountainCar PPO (Target)
    category: paradigm
    paradigm: online_rl
    experiment_ref: cartpole/quick_test
    overrides:
    - env=mountaincar
    - ++train.freeze_backbone=false
    pos:
    - 440
    - 120
    inputs:
    - name: initial_weights
      direction: input
      port_type: checkpoint
      description: Warm-start weights for fine-tuning / transfer learning.
      param_binding: ++model.checkpoint_path=${source.checkpoint_path}
      required: false
    outputs:
    - name: checkpoint
      direction: output
      port_type: checkpoint
      description: Saved policy checkpoint (.ckpt)
      param_binding: ''
      required: false
    - name: dataset
      direction: output
      port_type: dataset
      description: Generated trajectory buffer chunk files (.pkl)
      param_binding: ''
      required: false
    - name: metrics
      direction: output
      port_type: metrics
      description: Online training log CSV metrics
      param_binding: ''
      required: false
strings:
- id: wire_source_trainer_checkpoint_to_target_fine_tuner_initial_weights
  from: source_trainer.checkpoint
  to: target_fine_tuner.initial_weights
  port_type: checkpoint
  binding: ++model.checkpoint_path=${source.checkpoint_path}
