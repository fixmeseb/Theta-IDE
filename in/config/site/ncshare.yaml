# Site profile: Base NCShare cluster configuration
python_executable: auto
venv_dir: venv
mail_user: null  # Set your own email for Slurm notifications
mail_type: "END,FAIL"
consolidate: false

# Shared default hardware resources across NCShare partitions
resources:
  time: "01:00:00"
  nodes: 1
  gpu_type: null
  gres: null

module_loads: []
extra_pythonpath: []
extra_env_vars:
  PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
extra_sbatch_flags: []
dataset_search_dirs: []  # Optional: add cluster dataset search dirs (e.g. /path/to/shared/datasets)
