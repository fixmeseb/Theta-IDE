<!-- Shown in the in-app docs. Colours are {{role}} placeholders filled in from the current theme
     (text, muted, surface, border, accent, accent_soft or any other theme role). Qt's SVG renderer
     has no markers or CSS, so arrowheads are polygons and styling is per element. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560">
  <title>What happens when you launch training</title>
  <rect x="11" y="20" width="128" height="40" rx="7" fill="{{surface}}" stroke="{{border}}" stroke-width="1.2"/>
  <text x="75.0" y="45.0" font-family="sans-serif" font-size="14" fill="{{text}}" text-anchor="middle" font-weight="bold">Experiment panel</text>
  <line x1="75" y1="60" x2="75" y2="545" stroke="{{border}}" stroke-width="1.2" stroke-dasharray="4 5"/>
  <rect x="151" y="20" width="128" height="40" rx="7" fill="{{surface}}" stroke="{{border}}" stroke-width="1.2"/>
  <text x="215.0" y="45.0" font-family="sans-serif" font-size="14" fill="{{text}}" text-anchor="middle" font-weight="bold">LocalBackend</text>
  <line x1="215" y1="60" x2="215" y2="545" stroke="{{border}}" stroke-width="1.2" stroke-dasharray="4 5"/>
  <rect x="291" y="20" width="128" height="40" rx="7" fill="{{surface}}" stroke="{{border}}" stroke-width="1.2"/>
  <text x="355.0" y="45.0" font-family="sans-serif" font-size="14" fill="{{text}}" text-anchor="middle" font-weight="bold">JobManager</text>
  <line x1="355" y1="60" x2="355" y2="545" stroke="{{border}}" stroke-width="1.2" stroke-dasharray="4 5"/>
  <rect x="431" y="20" width="128" height="40" rx="7" fill="{{surface}}" stroke="{{border}}" stroke-width="1.2"/>
  <text x="495.0" y="45.0" font-family="sans-serif" font-size="14" fill="{{text}}" text-anchor="middle" font-weight="bold">run_pipeline.py</text>
  <line x1="495" y1="60" x2="495" y2="545" stroke="{{border}}" stroke-width="1.2" stroke-dasharray="4 5"/>
  <rect x="571" y="20" width="128" height="40" rx="7" fill="{{surface}}" stroke="{{border}}" stroke-width="1.2"/>
  <text x="635.0" y="45.0" font-family="sans-serif" font-size="14" fill="{{text}}" text-anchor="middle" font-weight="bold">engine script</text>
  <line x1="635" y1="60" x2="635" y2="545" stroke="{{border}}" stroke-width="1.2" stroke-dasharray="4 5"/>
  <rect x="711" y="20" width="128" height="40" rx="7" fill="{{accent_soft}}" stroke="{{accent}}" stroke-width="1.2"/>
  <text x="775.0" y="45.0" font-family="sans-serif" font-size="14" fill="{{text}}" text-anchor="middle" font-weight="bold">results/logs</text>
  <line x1="775" y1="60" x2="775" y2="545" stroke="{{border}}" stroke-width="1.2" stroke-dasharray="4 5"/>
  <rect x="851" y="20" width="128" height="40" rx="7" fill="{{surface}}" stroke="{{border}}" stroke-width="1.2"/>
  <text x="915.0" y="45.0" font-family="sans-serif" font-size="14" fill="{{text}}" text-anchor="middle" font-weight="bold">Monitor</text>
  <line x1="915" y1="60" x2="915" y2="545" stroke="{{border}}" stroke-width="1.2" stroke-dasharray="4 5"/>
  <text x="215" y="82" font-family="sans-serif" font-size="12" fill="{{muted}}" text-anchor="middle" font-weight="bold">IDE PROCESS</text>
  <text x="635" y="82" font-family="sans-serif" font-size="12" fill="{{muted}}" text-anchor="middle" font-weight="bold">CHILD PROCESSES</text>
  <polyline points="75,110 213,110" fill="none" stroke="{{muted}}" stroke-width="1.4"/>
  <polygon points="213.0,110.0 204.0,114.5 204.0,105.5" fill="{{muted}}"/>
  <text x="145.0" y="104" font-family="sans-serif" font-size="12" fill="{{muted}}" text-anchor="middle">1 · compose + validate</text>
  <polyline points="215,146 77,146" fill="none" stroke="{{muted}}" stroke-width="1.4" stroke-dasharray="5 4"/>
  <polygon points="77.0,146.0 86.0,141.5 86.0,150.5" fill="{{muted}}"/>
  <text x="145.0" y="140" font-family="sans-serif" font-size="12" fill="{{muted}}" text-anchor="middle">2 · config or errors</text>
  <polyline points="75,182 353,182" fill="none" stroke="{{muted}}" stroke-width="1.4"/>
  <polygon points="353.0,182.0 344.0,186.5 344.0,177.5" fill="{{muted}}"/>
  <text x="215.0" y="176" font-family="sans-serif" font-size="12" fill="{{muted}}" text-anchor="middle">3 · launch</text>
  <polyline points="355,218 493,218" fill="none" stroke="{{muted}}" stroke-width="1.4"/>
  <polygon points="493.0,218.0 484.0,222.5 484.0,213.5" fill="{{muted}}"/>
  <text x="425.0" y="212" font-family="sans-serif" font-size="12" fill="{{muted}}" text-anchor="middle">4 · QProcess start</text>
  <polyline points="495,246 530,246 530,272 497,272" fill="none" stroke="{{muted}}" stroke-width="1.4"/>
  <polygon points="497.0,272.0 506.0,267.5 506.0,276.5" fill="{{muted}}"/>
  <text x="538" y="263" font-family="sans-serif" font-size="12" fill="{{muted}}" text-anchor="start">5 · compose again, pre-flight validate</text>
  <polyline points="495,306 633,306" fill="none" stroke="{{muted}}" stroke-width="1.4"/>
  <polygon points="633.0,306.0 624.0,310.5 624.0,301.5" fill="{{muted}}"/>
  <text x="565.0" y="300" font-family="sans-serif" font-size="12" fill="{{muted}}" text-anchor="middle">6 · subprocess per method</text>
  <polyline points="635,342 773,342" fill="none" stroke="{{accent}}" stroke-width="2"/>
  <polygon points="773.0,342.0 764.0,346.5 764.0,337.5" fill="{{accent}}"/>
  <text x="705.0" y="336" font-family="sans-serif" font-size="12" fill="{{accent}}" text-anchor="middle" font-weight="bold">7 · append rows + events</text>
  <polyline points="775,378 357,378" fill="none" stroke="{{accent}}" stroke-width="2"/>
  <polygon points="357.0,378.0 366.0,373.5 366.0,382.5" fill="{{accent}}"/>
  <text x="565.0" y="372" font-family="sans-serif" font-size="12" fill="{{accent}}" text-anchor="middle" font-weight="bold">8 · file watcher fires; JobManager reads new lines</text>
  <polyline points="355,414 913,414" fill="none" stroke="{{accent}}" stroke-width="2"/>
  <polygon points="913.0,414.0 904.0,418.5 904.0,409.5" fill="{{accent}}"/>
  <text x="635.0" y="408" font-family="sans-serif" font-size="12" fill="{{accent}}" text-anchor="middle" font-weight="bold">9 · telemetry → LiveRun → charts</text>
  <polyline points="495,450 357,450" fill="none" stroke="{{muted}}" stroke-width="1.4" stroke-dasharray="5 4"/>
  <polygon points="357.0,450.0 366.0,445.5 366.0,454.5" fill="{{muted}}"/>
  <text x="425.0" y="444" font-family="sans-serif" font-size="12" fill="{{muted}}" text-anchor="middle">10 · stdout → Console</text>
  <polyline points="495,486 773,486" fill="none" stroke="{{muted}}" stroke-width="1.4"/>
  <polygon points="773.0,486.0 764.0,490.5 764.0,481.5" fill="{{muted}}"/>
  <text x="635.0" y="480" font-family="sans-serif" font-size="12" fill="{{muted}}" text-anchor="middle">11 · plot/manager.py: plots + reports</text>
  <polyline points="355,522 913,522" fill="none" stroke="{{muted}}" stroke-width="1.4" stroke-dasharray="5 4"/>
  <polygon points="913.0,522.0 904.0,526.5 904.0,517.5" fill="{{muted}}"/>
  <text x="635.0" y="516" font-family="sans-serif" font-size="12" fill="{{muted}}" text-anchor="middle">12 · exit code → completed or failed</text>
</svg>
