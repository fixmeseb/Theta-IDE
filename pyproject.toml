[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "theta-ide"
version = "0.1.0"
description = "General-purpose research IDE and modular experiment framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    # Core ML
    "torch>=2.0,<3",
    "lightning>=2.0,<3",
    # Config & Sweeps
    "hydra-core>=1.3,<2",
    "hydra-optuna-sweeper<=1.1.2",
    "optuna>=3.0,<5",
    "omegaconf>=2.3,<3",
    # Generic environment adapter used by the framework
    "gymnasium>=0.28",
    # Data & Visualization
    "numpy>=1.24,<3",
    "pandas>=2.0,<3",
    "matplotlib>=3.7,<4",
    "seaborn>=0.12",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "tqdm>=4.60",
    "tabulate>=0.9",
    "pillow>=9.0",
    "pyyaml>=6.0",
    "tensorboard>=2.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    # Bounds a hung GUI test so CI fails in minutes rather than hours
    "pytest-timeout>=2.3",
    "ruff>=0.5",
    "mypy>=1.0",
    "pre-commit>=3.0",
    "types-PyYAML>=6.0",
]
# The desktop app. It composes configs in-process and runs training as a QProcess,
# so it installs into the same venv as the pipeline: pip install -e ".[gui]"
gui = [
    "PyQt6>=6.7,<7",
    "PyQt6-WebEngine>=6.7,<7",
    "psutil>=5.9",
    "pywinpty>=2.0; sys_platform == 'win32'",
    "arxiv>=2.1",        # arXiv Papers panel
    "truststore>=0.9",   # HTTPS through the OS certificate store (networks that inspect TLS)
]
video = [
    "pygame",
    "vidmaker",
    "opencv-python",
]
all = [
    "theta-ide[dev,gui,video]",
]

# ── Package discovery ────────────────────────────────────────
[tool.setuptools.packages.find]
where = ["."]
include = [
    "src", "src.*",
    "plot", "plot.*",
]
exclude = [
]

# ── Ruff (linting + formatting) ─────────────────────────────
[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
    "in/envs",
    "venv",
]

[tool.ruff.lint]
# Start lenient — tighten incrementally
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
]
ignore = [
    "E402",  # module level import not at top of file
    "E501",  # line too long (handled by formatter)
    "E701",  # multiple statements on one line
    "E702",  # multiple statements on one line (semicolon)
    "E741",  # ambiguous variable names (common in math-heavy RL code)
    "F401",  # unused imports (too noisy during initial adoption)
    "F811",  # redefinition of unused function
    "F841",  # unused local variables (too noisy during initial adoption)
    "W293",  # blank line contains whitespace
    "UP006", # non-standard generic types
    "UP035", # deprecated typing imports
]

[tool.ruff.lint.isort]
known-first-party = ["src", "plot"]

# ── Mypy (type checking) ────────────────────────────────────
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
follow_imports = "silent"
exclude = [
    "in/envs",
    "venv",
]

# ── Coverage ─────────────────────────────────────────────────
[tool.coverage.run]
source = ["src", "plot"]
omit = [
    "*/test_*",
    "*/conftest.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

