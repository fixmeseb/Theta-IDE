[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs =
    in/envs
    venv
    .venv
    frontend/.venv
addopts =
    -v
    --tb=short
    --strict-markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    gpu: marks tests that require a GPU
    gui: marks tests that require PyQt6 GUI environment
