name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check src/ plot/ run_pipeline.py
      - name: Format check
        run: ruff format --check src/ plot/ run_pipeline.py

  test:
    # Pinned: the apt package names below are specific to Ubuntu 24.04 (e.g. libasound2t64)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Qt system libraries
        # PyQt6 wheels need these at import time; without them every GUI test file skips or errors
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbfile1 libgbm1 libasound2t64
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,gui]"
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ -v --tb=short --timeout=120 --timeout-method=thread --cov=src --cov=frontend --cov-report=xml --cov-report=term

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Type check
        run: mypy src/app/pipeline/ src/usr/algorithms/agent_registry.py --ignore-missing-imports --follow-imports=silent

  m0:
    # M0, the risk-killer eval: the config the GUI builds must be the config the
    # pipeline runs. See m0/README.md. The composition path is torch-free, so this
    # installs three small packages rather than the whole ML stack.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install config dependencies
        run: |
          pip install --upgrade pip
          pip install "hydra-core>=1.3,<2" "omegaconf>=2.3,<3" "pyyaml>=6.0"
      - name: M0 eval (config fidelity)
        run: python m0/eval_config_fidelity.py
      - name: M0 negative control (the eval must be able to fail)
        run: python m0/eval_config_fidelity.py --self-test
